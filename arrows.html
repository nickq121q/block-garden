<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#101c14">
<meta name="description" content="Стрелки — головоломка: нажимайте на стрелки и очищайте поле, пока путь до края свободен.">
<title>Стрелки</title>
<style>
:root {
	--bg: #0d1712;
	--bg-soft: #132018;
	--panel: #1a2a20;
	--panel-edge: #2a4232;
	--text: #eaf3ec;
	--text-dim: #9db3a4;
	--accent: #6dbf73;
	--accent-strong: #8fdc8f;
	--danger: #e0715f;
	--radius: 14px;
	--safe-top: env(safe-area-inset-top, 0px);
	--safe-bottom: env(safe-area-inset-bottom, 0px);
}

* {
	box-sizing: border-box;
	-webkit-tap-highlight-color: transparent;
}

html,
body {
	margin: 0;
	padding: 0;
	width: 100%;
	height: 100%;
	overflow: hidden;
	background: radial-gradient(120% 90% at 50% 0%, #17281d 0%, var(--bg) 70%);
	color: var(--text);
	font-family: "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
	overscroll-behavior: none;
}

body {
	user-select: none;
	-webkit-user-select: none;
	touch-action: none;
}

#app {
	position: fixed;
	inset: 0;
	display: flex;
	align-items: center;
	justify-content: center;
}

#game {
	display: block;
	touch-action: none;
}

#hud {
	position: absolute;
	top: calc(8px + var(--safe-top));
	left: 0;
	right: 0;
	display: flex;
	align-items: center;
	gap: 10px;
	padding: 0 14px;
	pointer-events: none;
}

.hud-block {
	display: flex;
	flex-direction: column;
	line-height: 1.1;
	background: rgba(19, 32, 24, 0.72);
	border: 1px solid var(--panel-edge);
	border-radius: var(--radius);
	padding: 6px 14px;
	min-width: 74px;
}

.hud-best {
	margin-left: auto;
	min-width: 66px;
}

.hud-label {
	font-size: 11px;
	letter-spacing: 0.08em;
	text-transform: uppercase;
	color: var(--text-dim);
}

.hud-value {
	font-size: 22px;
	font-weight: 700;
	font-variant-numeric: tabular-nums;
}

.icon-button {
	pointer-events: auto;
	width: 40px;
	height: 40px;
	border-radius: 50%;
	border: 1px solid var(--panel-edge);
	background: rgba(19, 32, 24, 0.72);
	color: var(--text-dim);
	font-size: 18px;
	cursor: pointer;
}

.icon-button.is-off {
	color: #5d7466;
}

.icon-button:active {
	transform: scale(0.94);
}

/* Нижняя панель действий: «Отменить», «Подсказка» и «Заново» под полем. */
#actions {
	position: absolute;
	bottom: calc(14px + var(--safe-bottom));
	left: 50%;
	transform: translateX(-50%);
	display: flex;
	flex-wrap: wrap;
	justify-content: center;
	gap: 12px;
	z-index: 6;
}

.action-button {
	padding: 10px 22px;
	border: 1px solid var(--panel-edge);
	border-radius: 999px;
	background: rgba(19, 32, 24, 0.84);
	color: var(--text);
	font-size: 14px;
	font-weight: 600;
	letter-spacing: 0.01em;
	cursor: pointer;
}

.action-button:hover {
	border-color: #37543f;
}

.action-button:active:not(:disabled) {
	transform: scale(0.97);
}

.action-button:disabled {
	opacity: 0.42;
	cursor: default;
}

/* Платная подсказка: золотая рамка, чтобы кнопка читалась как покупка. */
.action-button.action-paid {
	border-color: rgba(242, 212, 121, 0.55);
	color: #f2d479;
	font-size: 13px;
	padding: 10px 16px;
}

.action-button.action-paid:hover {
	border-color: rgba(242, 212, 121, 0.85);
}

.modal {
	position: absolute;
	inset: 0;
	display: flex;
	align-items: center;
	justify-content: center;
	background: rgba(6, 12, 8, 0.72);
	backdrop-filter: blur(3px);
	padding: 24px;
	z-index: 10;
}

.modal.hidden,
.toast.hidden {
	display: none;
}

.modal-card {
	width: min(340px, 100%);
	background: var(--panel);
	border: 1px solid var(--panel-edge);
	border-radius: 20px;
	padding: 22px 20px 18px;
	text-align: center;
	box-shadow: 0 18px 40px rgba(0, 0, 0, 0.45);
}

.modal-card h2 {
	margin: 0 0 14px;
	font-size: 22px;
}

.modal-card p {
	margin: 0 0 18px;
	color: var(--text-dim);
	font-size: 15px;
	line-height: 1.45;
}

.modal-row {
	display: flex;
	justify-content: space-between;
	padding: 6px 0;
	color: var(--text-dim);
	font-size: 15px;
}

.modal-row strong {
	color: var(--text);
	font-size: 17px;
	font-variant-numeric: tabular-nums;
}

.button {
	display: block;
	width: 100%;
	margin-top: 10px;
	padding: 13px 16px;
	border-radius: var(--radius);
	border: 1px solid var(--panel-edge);
	background: #22352a;
	color: var(--text);
	font-size: 16px;
	font-weight: 600;
	cursor: pointer;
}

.button-accent {
	background: linear-gradient(180deg, var(--accent-strong), var(--accent));
	border-color: #5aa860;
	color: #0b1a10;
}

.button.hidden {
	display: none;
}

.button:active:not(:disabled) {
	transform: scale(0.98);
}

.toast {
	position: absolute;
	bottom: calc(70px + var(--safe-bottom));
	left: 50%;
	transform: translateX(-50%);
	background: rgba(26, 42, 32, 0.96);
	border: 1px solid var(--panel-edge);
	color: var(--text);
	padding: 10px 18px;
	border-radius: 999px;
	font-size: 14px;
	z-index: 20;
	max-width: 88vw;
	text-align: center;
}

@media (max-width: 380px) {
	#hud {
		gap: 6px;
		padding: 0 8px;
	}

	.hud-block {
		min-width: 0;
		padding: 5px 9px;
	}

	.hud-best {
		min-width: 0;
	}

	.hud-value {
		font-size: 18px;
	}

	.action-button {
		padding: 9px 16px;
		font-size: 13px;
	}
}

</style>
</head>
<body>
<div id="app">
	<canvas id="game" aria-label="Поле со стрелками"></canvas>

	<header id="hud">
		<div class="hud-block">
			<span class="hud-label" data-i18n="hud.level">Уровень</span>
			<span class="hud-value" id="level">1</span>
		</div>
		<div class="hud-block">
			<span class="hud-label" data-i18n="hud.moves">Ходы</span>
			<span class="hud-value" id="moves">0</span>
		</div>
		<div class="hud-block hud-best">
			<span class="hud-label" data-i18n="hud.best">Лучший</span>
			<span class="hud-value" id="best">0</span>
		</div>
		<button id="btn-sound" class="icon-button" type="button" aria-label="Звук">
			<span id="sound-icon">♪</span>
		</button>
	</header>

	<div id="actions">
		<button id="btn-undo" class="action-button" type="button" data-i18n="action.undo">Отменить</button>
		<button id="btn-hint" class="action-button action-paid hidden" type="button" data-i18n="action.hint">Подсказка · 5 ⭐</button>
		<button id="btn-restart" class="action-button" type="button" data-i18n="action.restart">Заново</button>
	</div>

	<div id="modal-win" class="modal hidden" role="dialog" aria-modal="true">
		<div class="modal-card">
			<h2 data-i18n="win.title">Уровень пройден</h2>
			<div class="modal-row">
				<span data-i18n="win.moves">Ходы</span>
				<strong id="win-moves">0</strong>
			</div>
			<div class="modal-row">
				<span data-i18n="win.best">Лучший уровень</span>
				<strong id="win-best">0</strong>
			</div>
			<button id="btn-next" class="button button-accent" type="button" data-i18n="win.next">Дальше</button>
			<button id="btn-win-restart" class="button" type="button" data-i18n="win.restart">Заново</button>
			<button id="btn-share" class="button" type="button" data-i18n="win.share">Поделиться</button>
		</div>
	</div>

	<div id="modal-tutorial" class="modal hidden" role="dialog" aria-modal="true">
		<div class="modal-card">
			<h2 data-i18n="tutorial.title">Как играть</h2>
			<p data-i18n="tutorial.text">Нажмите на стрелку: она улетит за край поля, если путь свободен. Другие стрелки на пути мешают — сначала уберите их. Очистите поле полностью.</p>
			<button id="btn-tutorial-ok" class="button button-accent" type="button" data-i18n="tutorial.ok">Понятно</button>
		</div>
	</div>

	<div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
</div>
