<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
	<defs>
		<radialGradient id="bg" cx="50%" cy="30%" r="80%">
			<stop offset="0%" stop-color="#1b3122"/>
			<stop offset="60%" stop-color="#12211a"/>
			<stop offset="100%" stop-color="#0a1410"/>
		</radialGradient>
		<radialGradient id="glow" cx="50%" cy="50%" r="50%">
			<stop offset="0%" stop-color="#8fd18f" stop-opacity="0.28"/>
			<stop offset="100%" stop-color="#8fd18f" stop-opacity="0"/>
		</radialGradient>
		<linearGradient id="mint" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0%" stop-color="#a7e3a4"/>
			<stop offset="100%" stop-color="#6fbf78"/>
		</linearGradient>
		<linearGradient id="lime" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0%" stop-color="#cfe98c"/>
			<stop offset="100%" stop-color="#a8cd5f"/>
		</linearGradient>
		<linearGradient id="terracotta" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0%" stop-color="#f4b08a"/>
			<stop offset="100%" stop-color="#dd8158"/>
		</linearGradient>
		<linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0%" stop-color="#fae0a0"/>
			<stop offset="100%" stop-color="#e6bd5f"/>
		</linearGradient>
		<linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0%" stop-color="#ffffff" stop-opacity="0.34"/>
			<stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
		</linearGradient>
		<filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
			<feGaussianBlur stdDeviation="6"/>
		</filter>
	</defs>

	<rect width="512" height="512" rx="116" fill="url(#bg)"/>
	<circle cx="256" cy="250" r="230" fill="url(#glow)"/>

	<!-- мягкая тень под кластером -->
	<rect x="112" y="140" width="296" height="296" rx="48" fill="#000000" opacity="0.35" filter="url(#soft)"/>

	<!-- кластер 2x2 -->
	<g>
		<rect x="100" y="112" width="148" height="148" rx="34" fill="url(#mint)"/>
		<rect x="100" y="112" width="148" height="70" rx="34" fill="url(#shine)"/>

		<rect x="264" y="112" width="148" height="148" rx="34" fill="url(#lime)"/>
		<rect x="264" y="112" width="148" height="70" rx="34" fill="url(#shine)"/>

		<rect x="100" y="276" width="148" height="148" rx="34" fill="url(#gold)"/>
		<rect x="100" y="276" width="148" height="70" rx="34" fill="url(#shine)"/>

		<rect x="264" y="276" width="148" height="148" rx="34" fill="url(#terracotta)"/>
		<rect x="264" y="276" width="148" height="70" rx="34" fill="url(#shine)"/>
	</g>

	<!-- блики-искры -->
	<g fill="#eaf7ea" opacity="0.85">
		<circle cx="404" cy="92" r="7"/>
		<circle cx="428" cy="118" r="4"/>
		<circle cx="86" cy="140" r="5"/>
		<circle cx="70" cy="112" r="3"/>
	</g>
</svg>
