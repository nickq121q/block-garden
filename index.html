<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#101c14">
<meta name="description" content="Блок Сад — спокойная головоломка 8×8: собирайте линии и выращивайте рекорд.">
<title>Блок Сад</title>
<style>
:root {
	--bg: #0d1712;
	--bg-soft: #132018;
	--panel: #1a2a20;
	--panel-edge: #2a4232;
	--text: #eaf3ec;
	--text-dim: #9db3a4;
	--accent: #6dbf73;
	--accent-strong: #8fdc8f;
	--danger: #e0715f;
	--radius: 14px;
	--safe-top: env(safe-area-inset-top, 0px);
	--safe-bottom: env(safe-area-inset-bottom, 0px);
}

* {
	box-sizing: border-box;
	-webkit-tap-highlight-color: transparent;
}

html,
body {
	margin: 0;
	padding: 0;
	width: 100%;
	height: 100%;
	overflow: hidden;
	background: radial-gradient(120% 90% at 50% 0%, #17281d 0%, var(--bg) 70%);
	color: var(--text);
	font-family: "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
	overscroll-behavior: none;
}

body {
	user-select: none;
	-webkit-user-select: none;
	touch-action: none;
}

#app {
	position: fixed;
	inset: 0;
	display: flex;
	align-items: center;
	justify-content: center;
}

#game {
	display: block;
	touch-action: none;
}

#hud {
	position: absolute;
	top: calc(8px + var(--safe-top));
	left: 0;
	right: 0;
	display: flex;
	align-items: center;
	gap: 10px;
	padding: 0 14px;
	pointer-events: none;
}

.hud-block {
	display: flex;
	flex-direction: column;
	line-height: 1.1;
	background: rgba(19, 32, 24, 0.72);
	border: 1px solid var(--panel-edge);
	border-radius: var(--radius);
	padding: 6px 14px;
	min-width: 92px;
}

.hud-best {
	margin-left: auto;
}

.hud-label {
	font-size: 11px;
	letter-spacing: 0.08em;
	text-transform: uppercase;
	color: var(--text-dim);
}

.hud-value {
	font-size: 22px;
	font-weight: 700;
	font-variant-numeric: tabular-nums;
}

/* Метка задачи дня живёт в блоке счёта вместо подписи «Счёт»:
   так HUD не растёт в ширину и остаётся в одну строку на узком экране. */
.hud-daily {
	display: flex;
	gap: 6px;
	font-size: 10px;
	line-height: 1.25;
	letter-spacing: 0.04em;
	color: var(--accent);
	white-space: nowrap;
}

.hud-daily.hidden {
	display: none;
}

/* Чип режима под полем: та же «таблетка», что у баннера, но спокойнее. */
.mode-chip {
	position: absolute;
	bottom: calc(14px + var(--safe-bottom));
	left: 50%;
	transform: translateX(-50%);
	z-index: 6;
	padding: 8px 16px;
	border: 1px solid var(--panel-edge);
	border-radius: 999px;
	background: rgba(19, 32, 24, 0.82);
	color: var(--text-dim);
	font-size: 13px;
	font-weight: 600;
	letter-spacing: 0.02em;
	cursor: pointer;
}

.mode-chip:hover {
	border-color: #37543f;
	color: var(--text);
}

.mode-chip:active {
	transform: translateX(-50%) scale(0.96);
}

/* Узкие экраны: HUD с меткой задачи дня остаётся в одну строку. */
@media (max-width: 380px) {
	#hud {
		gap: 6px;
		padding: 0 8px;
	}

	.hud-block {
		min-width: 0;
		padding: 5px 9px;
	}

	.hud-value {
		font-size: 18px;
	}

	.hud-daily {
		gap: 4px;
		font-size: 9px;
	}
}

.icon-button {
	pointer-events: auto;
	width: 40px;
	height: 40px;
	border-radius: 50%;
	border: 1px solid var(--panel-edge);
	background: rgba(19, 32, 24, 0.72);
	color: var(--text-dim);
	font-size: 18px;
	cursor: pointer;
}

.icon-button.is-off {
	color: #5d7466;
}

.icon-button:active {
	transform: scale(0.94);
}

.modal {
	position: absolute;
	inset: 0;
	display: flex;
	align-items: center;
	justify-content: center;
	background: rgba(6, 12, 8, 0.72);
	backdrop-filter: blur(3px);
	padding: 24px;
	z-index: 10;
}

.modal.hidden,
.toast.hidden,
.banner.hidden {
	display: none;
}

/* Кнопки, которые прячутся по состоянию игры (возрождение уже использовано). */
.button.hidden {
	display: none;
}

.modal-card {
	width: min(340px, 100%);
	background: var(--panel);
	border: 1px solid var(--panel-edge);
	border-radius: 20px;
	padding: 22px 20px 18px;
	text-align: center;
	box-shadow: 0 18px 40px rgba(0, 0, 0, 0.45);
}

.modal-card h2 {
	margin: 0 0 14px;
	font-size: 22px;
}

.modal-card p {
	margin: 0 0 18px;
	color: var(--text-dim);
	font-size: 15px;
	line-height: 1.45;
}

.modal-row {
	display: flex;
	justify-content: space-between;
	padding: 6px 0;
	color: var(--text-dim);
	font-size: 15px;
}

.modal-row strong {
	color: var(--text);
	font-size: 17px;
	font-variant-numeric: tabular-nums;
}

/* Статистика партий: спокойная строка под счётом и рекордом. */
.modal-row-stats {
	justify-content: center;
	margin-top: 6px;
	padding-top: 10px;
	border-top: 1px solid var(--panel-edge);
	font-size: 13px;
	letter-spacing: 0.01em;
}

/* Баннер «на главный экран»: полоска под полем, не модалка. */
.banner {
	position: absolute;
	bottom: calc(14px + var(--safe-bottom));
	left: 50%;
	transform: translateX(-50%);
	display: flex;
	align-items: center;
	gap: 10px;
	max-width: min(460px, 96vw);
	padding: 9px 10px 9px 16px;
	white-space: nowrap;
	background: rgba(26, 42, 32, 0.97);
	border: 1px solid var(--panel-edge);
	border-radius: 999px;
	box-shadow: 0 10px 26px rgba(0, 0, 0, 0.4);
	color: var(--text-dim);
	font-size: 13px;
	line-height: 1.25;
	z-index: 30;
}

.banner-button {
	flex: none;
	padding: 7px 14px;
	border-radius: 999px;
	border: 1px solid #5aa860;
	background: linear-gradient(180deg, var(--accent-strong), var(--accent));
	color: #0b1a10;
	font-size: 13px;
	font-weight: 700;
	cursor: pointer;
}

.banner-button:active {
	transform: scale(0.97);
}

.banner-close {
	flex: none;
	width: 28px;
	height: 28px;
	border-radius: 50%;
	border: 1px solid var(--panel-edge);
	background: transparent;
	color: var(--text-dim);
	font-size: 13px;
	line-height: 1;
	cursor: pointer;
}

/* Узкие экраны: подпись и кнопки баннера остаются в одну строку. */
@media (max-width: 360px) {
	.banner {
		gap: 6px;
		padding: 8px 8px 8px 12px;
		font-size: 12px;
	}

	.banner-button {
		padding: 6px 10px;
		font-size: 12px;
	}
}

.button {
	display: block;
	width: 100%;
	margin-top: 10px;
	padding: 13px 16px;
	border-radius: var(--radius);
	border: 1px solid var(--panel-edge);
	background: #22352a;
	color: var(--text);
	font-size: 16px;
	font-weight: 600;
	cursor: pointer;
}

.button-accent {
	background: linear-gradient(180deg, var(--accent-strong), var(--accent));
	border-color: #5aa860;
	color: #0b1a10;
}

/* Покупка возрождения за Telegram Stars: звёздный градиент, не спорит с зелёным. */
.button-stars {
	background: linear-gradient(180deg, #ffd76a, #e0a72c);
	border-color: #c69126;
	color: #2a1c00;
}

.button:disabled {
	opacity: 0.55;
	cursor: default;
}

.button:active:not(:disabled) {
	transform: scale(0.98);
}

.toast {
	position: absolute;
	bottom: calc(24px + var(--safe-bottom));
	left: 50%;
	transform: translateX(-50%);
	background: rgba(26, 42, 32, 0.96);
	border: 1px solid var(--panel-edge);
	color: var(--text);
	padding: 10px 18px;
	border-radius: 999px;
	font-size: 14px;
	z-index: 20;
	max-width: 88vw;
	text-align: center;
}

</style>
</head>
<body>
<div id="app">
	<canvas id="game" aria-label="Игровое поле"></canvas>

	<header id="hud">
		<div class="hud-block hud-score">
			<span class="hud-label" id="hud-score-label" data-i18n="hud.score">Счёт</span>
			<span class="hud-daily hidden" id="hud-daily">
				<span id="daily-label" data-i18n="daily.label">Задача дня</span>
				<span id="daily-streak">Серия: 0</span>
			</span>
			<span class="hud-value" id="score">0</span>
		</div>
		<div class="hud-block hud-best">
			<span class="hud-label" data-i18n="hud.best">Рекорд</span>
			<span class="hud-value" id="best">0</span>
		</div>
		<button id="btn-sound" class="icon-button" type="button" aria-label="Звук">
			<span id="sound-icon">♪</span>
		</button>
	</header>

	<button id="btn-mode" class="mode-chip" type="button">
		<span id="mode-text">Задача дня</span>
	</button>

	<div id="modal-gameover" class="modal hidden" role="dialog" aria-modal="true">
		<div class="modal-card">
			<h2 id="gameover-title" data-i18n="gameover.title">Игра окончена</h2>
			<div class="modal-row">
				<span data-i18n="hud.score">Счёт</span>
				<strong id="go-score">0</strong>
			</div>
			<div class="modal-row">
				<span id="go-best-label" data-i18n="hud.best">Рекорд</span>
				<strong id="go-best">0</strong>
			</div>
			<div class="modal-row modal-row-stats" id="go-stats">Партий: 0 · Линий: 0 · Сегодня: 0</div>
			<button id="btn-buy-revive" class="button button-stars hidden" type="button"
				data-i18n="gameover.buyRevive">Продолжить за 10 ⭐</button>
			<button id="btn-revive" class="button button-accent" type="button"
				data-i18n="gameover.revive">Продолжить за рекламу</button>
			<button id="btn-share" class="button" type="button"
				data-i18n="gameover.share">Поделиться результатом</button>
			<button id="btn-restart" class="button" type="button"
				data-i18n="gameover.restart">Заново</button>
		</div>
	</div>

	<div id="banner-home" class="banner hidden" role="status">
		<span data-i18n="home.text">Добавить игру на главный экран?</span>
		<button id="btn-home-add" class="banner-button" type="button" data-i18n="home.add">Добавить</button>
		<button id="btn-home-close" class="banner-close" type="button" aria-label="Скрыть">✕</button>
	</div>

	<div id="modal-tutorial" class="modal hidden" role="dialog" aria-modal="true">
		<div class="modal-card">
			<h2 data-i18n="tutorial.title">Как играть</h2>
			<p data-i18n="tutorial.text">Перетаскивайте фигуры на поле. Заполненная строка или столбец сгорает и приносит очки.</p>
			<button id="btn-tutorial-ok" class="button button-accent" type="button"
				data-i18n="tutorial.ok">Понятно</button>
		</div>
	</div>

	<div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
</div>
